name: 'Deploy to Cloud Run Job with GPU'

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'llm-garage'
  REGION: 'us-central1'
  SERVICE: 'llm-garage-finetune'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      - name: 'Build and Push Docker Image'
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _HF_TOKEN=${{ secrets.HF_TOKEN }},_SERVICE=${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }}

      - name: 'Deploy initial Cloud Run Job'
        run: |
          gcloud beta run jobs deploy ${{ env.SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --cpu 8 \
            --memory 32Gi \
            --gpu 1 \
            --gpu-type nvidia-l4 \
            --task-timeout 3600s \
            --max-retries 1

      - name: 'Install yq'
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: 'Patch Cloud Run Job with GPU Annotations'
        run: |
          # Export current job config to YAML
          gcloud run jobs describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format export > job.yaml

          # Add required annotations
          yq -i '
            .metadata.annotations["run.googleapis.com/launch-stage"]="BETA" |
            .spec.template.metadata.annotations["run.googleapis.com/gpu-zonal-redundancy-disabled"]="true"
          ' job.yaml

          # Replace job with modified YAML
          gcloud run jobs replace job.yaml


