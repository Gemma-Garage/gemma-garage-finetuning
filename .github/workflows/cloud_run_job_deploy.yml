name: 'Deploy to Cloud Run Job with GPU'

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'llm-garage'
  REGION: 'us-central1'
  SERVICE: 'llm-garage-finetune'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      
      - name: 'Build and Push Docker Image'
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _HF_TOKEN=${{ secrets.HF_TOKEN }},_SERVICE=${{ env.SERVICE }} \
            --project ${{ env.PROJECT_ID }}

      - name: 'Generate Cloud Run Job YAML'
        run: |
          cat > job.yaml <<EOF
          apiVersion: run.googleapis.com/v1
          kind: Job
          metadata:
            name: ${SERVICE}
            labels:
              cloud.googleapis.com/location: ${REGION}
            annotations:
              run.googleapis.com/launch-stage: BETA
          spec:
            template:
              metadata:
                annotations:
                  run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
              spec:
                template:
                  spec:
                    containers:
                    - image: gcr.io/${PROJECT_ID}/${SERVICE}
                      limits:
                        cpu: "8"
                        memory: "32Gi"
                        nvidia.com/gpu: "1"
                    nodeSelector:
                      run.googleapis.com/accelerator: nvidia-l4
          EOF

      - name: 'Deploy Cloud Run Job with GPU'
        run: |
          gcloud run jobs replace job.yaml --region ${{ env.REGION }}

