[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers

# Markers for categorizing tests
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test multiple components together
    slow: Tests that take a long time to run
    requires_gpu: Tests that require GPU (skipped by default)
    requires_cloud: Tests that require cloud credentials (skipped by default)

# Ignore specific directories
norecursedirs = .git __pycache__ .pytest_cache src

# Minimum pytest version
minversion = 7.0

# Show local variables in tracebacks (use --showlocals flag when running pytest)

# Warnings filter
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Console output format
console_output_style = progress

# Fail on warnings (optional, can be enabled for stricter testing)
# filterwarnings = error
