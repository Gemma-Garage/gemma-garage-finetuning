apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: llm-garage-finetune
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"
    spec:
      template:
        spec:
          containers:
            - name: llm-garage-finetune
              image: gcr.io/llm-garage/llm-garage-finetune
              resources:
                limits:
                  cpu: "8"
                  memory: "32Gi"
                  nvidia.com/gpu: "1"
          nodeSelector:
            run.googleapis.com/accelerator: nvidia-l4
          maxRetries: 1
          timeoutSeconds: 3600

